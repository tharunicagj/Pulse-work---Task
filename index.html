<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status Checker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #12345a;
            margin-bottom: 15px;
        }

        .welcome {
            color: #555;
            margin-bottom: 25px;
        }

        .banner {
            padding: 18px;
            margin-bottom: 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .online {
            background-color: #2563a6;
        }

        .checking {
            background-color: #55a6d9;
        }

        .offline {
            background-color: #17365d;
        }

        button {
            background-color: #12345a;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #2563a6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>System Status</h1>

        <p class="welcome">
            Welcome! Check your system status.
        </p>

        <div id="statusBanner" class="banner checking">
            System is Checking...
        </div>

        <button onclick="checkSystemStatus()">
            Check System Status
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
